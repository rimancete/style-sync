    <clipPath id="poleL"><rect x="48" y="142" width="34" height="176" rx="16"/></clipPath>
    <clipPath id="poleR"><rect x="398" y="142" width="34" height="176" rx="16"/></clipPath>
  </defs>
  <rect width="480" height="480" fill="#0b0c0e"/>
