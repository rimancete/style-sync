<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
  <title id="title">Acme Barber Shop</title>
  <desc id="desc">Vintage barber emblem in charcoal, antique gold, red and blue, with crossed barber tools.</desc>
  <defs>
